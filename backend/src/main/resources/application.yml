server:
  port: ${PORT:8081}
  error: { include-message: always }
spring:
  datasource: { url: "jdbc:h2:file:./data/epc", username: sa, password: "" }
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
  servlet: { multipart: { max-file-size: 10MB, max-request-size: 10MB } }
app:
  cors-origins: ${CORS_ORIGINS:}
anthropic:
  key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
---
spring:
  config: { activate: { on-profile: postgres } }
  datasource: { url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:epc}", username: "${DB_USER:epc}", password: "${DB_PASSWORD:epc}" }

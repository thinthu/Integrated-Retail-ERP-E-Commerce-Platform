services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: epc, POSTGRES_USER: epc, POSTGRES_PASSWORD: epc }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    depends_on: [db]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/epc
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8081:8081"]
    volumes: [uploads:/app/uploads]
  frontend:
    build: { context: ./frontend, args: { VITE_API: "http://localhost:8081" } }
    depends_on: [backend]
    ports: ["3000:80"]
volumes:
  pgdata:
  uploads:
